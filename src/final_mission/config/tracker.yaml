# 统一跟踪器参数。
#
# 继承 waypoint_tools/scripts/avoidance_zone_astar_test.py，因此这里同时包含：
#   1. 父类（分区 A* 避障 + 连续参考线 Pure Pursuit）需要覆盖的默认值；
#   2. 本包新增的任务点停靠与握手参数。
#
# 注意：父类 max_linear 默认 0.35，会截断 target_speed。想跑 0.35 就必须
# 把 max_linear 抬到 0.35 以上，否则实际速度被 clamp 掉。

# ---------------- 话题 ----------------
odom_topic: /Odometry
cmd_topic: /smoother_cmd_vel
cloud_topic: /cloud_registered
obstacle_source: cloud

# ---------------- 巡航速度 ----------------
target_speed: 1.00
max_linear: 1.00          # 必须 >= target_speed；比赛巡航速度仍由 target_speed 单独设置
# 1m/s 巡航时降低高速转向峰值，减少避障出口左右摆动。
max_angular: 0.80

# 1m/s 时增大前视距离，避免目标点过近造成 Pure Pursuit 左右反复修正。
lookahead_distance: 0.80
min_lookahead: 0.60
max_lookahead: 1.80
lookahead_speed_ratio: 1.80

# 0.8m/s 时动态前视约 1.44m。A* 路径点间隔约 0.30m，执行 7 点可提供
# 约 1.8m 的连续路径，避免原来的 5 点短于前视距离而频繁追逐段尾。
execute_points: 7

# 连续参考线使用更长视野和轻度更强的平滑，提升高速出避障区的衔接稳定性。
reference_horizon: 6.0
reference_smoothing_window: 7

# 避障出口继续由 A* 引导一段距离，确认回到原路线后再释放到普通跟踪。
zone_handoff_distance: 2.00
zone_handoff_early_release: 0.60
# 只有基本回到原路线中心后才提前交给连续跟踪；到达完整交接终点仍会兜底释放。
zone_handoff_lateral_tolerance: 0.10

# ---------------- 重复航迹进度防跳 ----------------
# 这里只限制“车辆当前属于哪一段 CSV”的匹配窗口，不改变 A* 的 4m 参考线、
# 1.2/2.0/3.0m 前向采样或点云避障距离。indoor.csv 平均点距约 0.16m，
# 12 个点约 1.9m；原来的 80 个点会跨过整圈并误匹配到第二轮/出场段。
progress_search_ahead: 12
progress_search_back: 10
progress_max_advance: 1.00
progress_heading_tolerance: 0.70

# 区外任务点后重接路线时，1.0~1.8m 的轻度投影前跳连续确认 3 帧；
# 确认期间限速而非立即锁停。超过 1.8m 仍按定位/跨圈异常锁停。
progress_recovery_max_advance: 1.80
progress_recovery_samples: 3
progress_recovery_tolerance: 0.30
progress_recovery_speed: 0.25

# A* 绕行时车辆会暂时离开原始 CSV，重新靠回路线的一刻可能产生 1m 以上
# 的合理进度跳变。只在 avoid_start..avoid_end（含出口交接走廊）内允许：
# 避障区独立向前搜索 20 段，indoor.csv 实算最大约 3.445m，因此留到 3.60m。
# 1.00~3.60m 的候选必须连续 3 帧一致才接受；超过 3.60m 仍永久锁停。
# 区外仍严格使用上面的 1.00m，不会削弱重复航迹/跨圈防跳保护。
progress_zone_search_ahead: 20
progress_zone_max_advance: 3.60
progress_zone_confirm_samples: 3
progress_zone_confirm_tolerance: 0.30

# ---------------- 任务点停靠 ----------------
# 三个抓取候选点（piper_stop_2/3/4）与三个放置候选点（piper_stop_5/6/7）
# 相邻间距只有 0.30~0.40m，因此：
#   approach_switch_dist 必须 > 最大点间距，让候选点之间全程走 P 控制点到点，
#   避免在 Pure Pursuit 与 P 控制之间反复切换。
#   task_trigger_margin 必须 > approach_switch_dist，留出从巡航平滑降速的距离。
task_trigger_margin: 1.80
approach_switch_dist: 0.55
approach_k_linear: 0.5
approach_max_speed: 0.10  # 候选点之间机械臂仍侧伸，限速护臂
approach_min_speed: 0.04  # 履带静摩擦死区，需实测：发递增速度找轮子起转阈值
goal_reached_dist: 0.03
# 逼近阶段单独限制转向，避免继承全局 1.0rad/s 后在桌边猛摆。
approach_max_angular: 0.30
# 10cm 内逐步放弃追逐瞬时目标方向，改为保持 CSV 记录航向；
# 防止接近 3cm 停车阈值时，毫米级横向残差被 atan2 放大成大角度。
approach_near_goal_dist: 0.10

# 1m/s 巡航时需要比原 0.60m/s^2 更高的受控减速能力，
# 才能在 approach_switch_dist 前降至靠站速度。
max_linear_decel: 1.00
# 限制角速度变化率，避免高速时左右扭摆。
max_angular_accel: 0.60
# 普通路径目标方向过大时，先按该斜率受控减速再原地转向；障碍急停不使用此斜率。
heading_stop_decel: 1.50

# 朝向对齐只作用于 ext:* 任务点；普通巡航点仍由 Pure Pursuit 连续通过，
# 不停车逐点对齐 CSV yaw。实机已确认机械臂各姿态原地转向不会碰桌，
# 因此不再用 0.10rad(5.7°) 上限跳过大角度误差，而是始终尝试对齐。
# 单独限制原地对齐角速度，避免直接使用全局 max_angular=1.0rad/s 猛转。
task_yaw_tolerance: 0.05        # rad, 约 2.9°
task_yaw_max_angular: 0.30      # rad/s, 约 17.2°/s
task_yaw_k: 1.2
task_yaw_min_angular: 0.08      # 角速度死区，需实测

# 超时兜底：到不了就带着误差往下走。视觉在机械臂基座系闭环，
# 8cm 级误差能被吃掉；在原地磨时间才是纯损失。
approach_timeout: 15.0
align_timeout: 8.0

# ---------------- 外部任务握手 ----------------
task_event_topic: /waypoint_task_event
task_done_topic: /waypoint_task_done
skip_topic: /piper_task/navigation_skip
# 总控在第一红绿灯点见红后，用此话题把下一个灯点改为普通巡航点。
task_bypass_topic: /final_mission/task_bypass_next
# 单次 card 约 21s、pick 约 24s，最多 3 次尝试 → 留足重试时间。
external_task_timeout: 150.0
unknown_task_policy: skip
detect_pause_time: 2.0

# ---------------- 仅抓取全点失败时允许的倒车恢复 ----------------
# 正常巡航链仍会把所有负线速度压成 0。只有 final_tracker 亲自核验
# pick3 的“全点未找到”或“第三点目标仍在边缘”失败后，
# 以下专用控制器才会开放当前一段负速度；其他失败、其他任务点或人工误发
# reverse 都会被拒绝。边缘失败先短倒到一次性恢复点，恢复点不属于正常航迹。
backtrack_command_topic: /final_mission/backtrack_command
backtrack_event_topic: /final_mission/backtrack_event
arm_result_topic: /piper_task/result

reverse_k_linear: 0.35
reverse_min_speed: 0.035
reverse_max_speed: 0.06
reverse_accel: 0.08
reverse_max_angular: 0.12
reverse_yaw_k: 0.8
# 航向误差超过0.10rad时线速度立即归零并原地纠偏，回到0.05rad内才恢复倒退。
# 0.35rad是纠偏仍无法控制时的最终安全上限，不再用0.12rad瞬时误差直接放弃。
reverse_yaw_slow_threshold: 0.10
reverse_yaw_resume_threshold: 0.05
reverse_max_yaw_error: 0.35
reverse_heading_correction_timeout: 4.0
reverse_goal_dist: 0.04
reverse_cross_track_max: 0.10
# 不再只用二维距离判定到达：沿倒退方向达到目标前4cm且横向偏差不超过
# 10cm时立即停车。若定位跳变导致越过目标超过8cm，仍按异常终止。
reverse_arrival_cross_track_max: 0.10
reverse_arrival_overshoot_max: 0.08
reverse_timeout: 12.0
# 第三点检测到目标但位于边缘时，先从第三点短倒约14cm重新观察。
reverse_recovery_mid_dist: 0.14
# 14cm短倒单独限速，候选点之间的30~40cm倒车仍使用上面的0.06m/s。
reverse_recovery_mid_max_speed: 0.04
# 防止航迹任务标错后向后长距离行驶；实录点间距预计只有 0.30~0.40m。
reverse_max_segment_dist: 0.80

# 车尾保险杠后方净空小于此值立即终止倒车。倒车时必须有新鲜点云，
# 没有点云或点云超时会直接放弃本轮取货，绝不盲倒。
reverse_rear_stop_dist: 0.20
reverse_safety_half_width: 0.40
reverse_require_obstacles: true

# ---------------- 终点 ----------------
# 终点停车由航迹最后一行的 ext:finish 任务点负责：跟踪器照常走
# APPROACH -> ALIGN_YAW -> TASK，总控收到 start:finish 后发 done 并在
# finish_done_delay 后禁用跟踪器。
#
# 注意：不要在这里加 enable_final_yaw_align / final_yaw_tolerance /
# finish_stop_time —— 那三个参数只有 follow_waypoints.py 和
# pure_pursuit_follower.py 读，本跟踪器的父类
# pure_pursuit_astar_follower.py 不读，写了不生效反而误导。
