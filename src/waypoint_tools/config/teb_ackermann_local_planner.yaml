# ---- TEB Local Planner 参数 (阿克曼小车专用) ----
TebLocalPlannerROS:
  # ---- 轨迹 ----
  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  global_plan_overwrite_orientation: true
  max_global_plan_lookahead_dist: 3.0
  feasibility_check_no_poses: 5

  # ---- 机器人运动学（阿克曼底盘）----
  max_vel_x: 0.5                    # 最大前进速度
  max_vel_x_backwards: 0.2          # 最大后退速度
  max_vel_theta: 0.6                # 最大角速度
  acc_lim_x: 0.5                    # 线加速度限制
  acc_lim_theta: 0.8                # 角加速度限制

  # ⭐ 阿克曼关键参数
  min_turning_radius: 1.3           # 最小转弯半径 (轴距0.65m, 最大转向角~26°)
  wheelbase: 0.65                   # 轴距（前后轮距离）
  cmd_angle_instead_rotvel: false   # false=输出角速度, true=输出转向角

  footprint_model:
    type: "polygon"
    vertices: [[-0.30, -0.25], [-0.30, 0.25], [0.30, 0.25], [0.30, -0.25]]

  # ---- 目标到达容差 ----
  xy_goal_tolerance: 0.30
  yaw_goal_tolerance: 0.5
  free_goal_vel: false              # 阿克曼车到达目标时需要停止

  # ---- 障碍物 ----
  min_obstacle_dist: 0.20           # 最小障碍物距离（阿克曼车需要更大安全距离）
  inflation_dist: 0.3               # 膨胀距离
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.5
  obstacle_poses_affected: 30
  legacy_obstacle_association: false
  obstacle_association_force_inclusion_factor: 1.5
  obstacle_association_cutoff_factor: 5.0

  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  # ---- 优化权重 ----
  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.1

  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1

  # ⭐ 阿克曼关键权重
  weight_kinematics_nh: 1000            # 非完整约束（必须很大）
  weight_kinematics_forward_drive: 10   # 偏好前进（阿克曼车不易倒车）
  weight_kinematics_turning_radius: 50  # 转弯半径约束权重（重要！）

  weight_optimaltime: 1
  weight_shortest_path: 0
  weight_obstacle: 50                   # 障碍物权重（阿克曼车需提前避障）
  weight_inflation: 0.2
  weight_dynamic_obstacle: 10
  weight_viapoint: 1
  weight_prefer_rotdir: 50              # 偏好旋转方向一致性

  # ---- 并行规划（多条候选轨迹绕障）----
  enable_homotopy_class_planning: true
  enable_multithreading: true
  simple_exploration: false
  max_number_classes: 3                 # 阿克曼车减少候选轨迹数
  roadmap_graph_no_samples: 15
  roadmap_graph_area_width: 5
  roadmap_graph_area_length_scale: 1.0
  h_signature_prescaler: 0.5
  h_signature_threshold: 0.1

  selection_cost_hysteresis: 1.0
  selection_prefer_initial_plan: 0.95
  selection_obst_cost_scale: 100.0
  selection_viapoint_cost_scale: 1.0
  selection_alternative_time_cost: false

  # ---- 其他 ----
  odom_topic: /Odometry
  map_frame: map

  # ---- 恢复行为 ----
  shrink_horizon_backup: true
  shrink_horizon_min_duration: 10
  oscillation_recovery: true
  oscillation_v_eps: 0.1
  oscillation_omega_eps: 0.1
  oscillation_recovery_min_duration: 10
  oscillation_filter_duration: 10
